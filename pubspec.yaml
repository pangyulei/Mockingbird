name: mockingbird
description: "A video/audio player for shadowing any language."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0-327.4.beta

dependencies:
  flutter:
    sdk: flutter
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  path: ^1.9.1
  path_provider: ^2.1.5
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  google_fonts: ^8.1.0
  video_player: ^2.9.2
  marquee: ^2.3.0
  scrollable_positioned_list: ^0.3.8
  go_router: ^17.3.0
  collection: ^1.19.1
  async: ^2.13.1
  equatable: ^2.0.8
  defer: ^1.0.0
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  synchronized: ^3.4.1
  flutter_easyloading: ^3.0.5
  package_info_plus: ^9.0.1
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  objectbox_generator: any
  riverpod_lint: ^3.1.3
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/icon.png'
  adaptive_icon_background: '#0E1621'
  adaptive_icon_foreground: 'assets/icon.png'
